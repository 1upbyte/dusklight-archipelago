# Twilight Princess (Dusklight) — Normal preset
#
# The standard multiworld: the prologue is skipped but most twilights are not, keys move
# between dungeons, and three dungeons are shuffled while the rest keep their vanilla
# contents. Around 200 checks.
name: Player{number}
description: Twilight Princess (Dusklight) - Normal
game: Twilight Princess (Dusklight)
# Needs the apworld from the same release (or newer).
requires:
  game:
    Twilight Princess (Dusklight): 1.8.0

Twilight Princess (Dusklight):
  skip_prologue: true
  skip_midnas_desperate_hour: true
  faron_twilight_cleared: true
  eldin_twilight_cleared: false
  lanayru_twilight_cleared: false
  skip_minor_cutscenes: true
  skip_major_cutscenes: false
  unlock_map_regions: true

  open_door_of_time: true
  goron_mines_entrance: no_wrestling
  city_does_not_require_filled_skybook: false

  shuffled_dungeons: 3
  small_keys: any_dungeon
  big_keys: any_dungeon
  maps_and_compasses: start_with
  dungeon_rewards_can_be_anywhere: false

  golden_bugs: false
  sky_characters: false
  gifts_from_npcs: false
  shop_items: false
  hidden_skills: true
  hidden_rupees: false
  freestanding_rupees: false
  poe_souls: vanilla

  item_scarcity: vanilla
  trap_item_frequency: few
  hyrule_barrier_requirements: dungeons
  hyrule_barrier_dungeons: 4
  hyrule_castle_big_key_requirements: none
  palace_of_twilight_requirements: mirror_shards
  temple_of_time_sword_requirement: none
  logic_transform_anywhere: true
  logic_increase_wallet_capacity: true

  # Keep other players' important items out of the final dungeon, so nobody waits
  # on the very end of this game for them.
  exclude_locations: [Hyrule Castle]

  # Pull this game's progression earlier, so there's less waiting in the long tail.
  progression_balancing: 80

  # Start with the Shadow Crystal, so you can turn into a wolf from the beginning.
  start_inventory_from_pool:
    Shadow Crystal: 1
