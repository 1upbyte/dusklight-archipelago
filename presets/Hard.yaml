# Twilight Princess (Dusklight) — Hard preset
#
# A long multiworld: nothing is skipped, keys can be anywhere, golden bugs, sky characters,
# hidden skills and shop items are checks, six dungeons are shuffled, and the castle needs
# most of the dungeons cleared. Around 300 checks.
name: Player{number}
description: Twilight Princess (Dusklight) - Hard
game: Twilight Princess (Dusklight)
# Needs the apworld from the same release (or newer).
requires:
  game:
    Twilight Princess (Dusklight): 1.8.0

Twilight Princess (Dusklight):
  skip_prologue: true
  skip_midnas_desperate_hour: false
  faron_twilight_cleared: false
  eldin_twilight_cleared: false
  lanayru_twilight_cleared: false
  skip_minor_cutscenes: true
  skip_major_cutscenes: false
  unlock_map_regions: false

  shuffled_dungeons: 6
  small_keys: anywhere
  big_keys: anywhere
  maps_and_compasses: anywhere
  dungeon_rewards_can_be_anywhere: true
  small_keys_on_bosses: true

  golden_bugs: true
  sky_characters: true
  gifts_from_npcs: false
  shop_items: true
  hidden_skills: true
  hidden_rupees: false
  freestanding_rupees: false
  poe_souls: vanilla

  item_scarcity: vanilla
  trap_item_frequency: many
  hyrule_barrier_requirements: dungeons
  hyrule_barrier_dungeons: 7
  hyrule_castle_big_key_requirements: fused_shadows
  hyrule_castle_big_key_fused_shadows: 3
  palace_of_twilight_requirements: vanilla
  temple_of_time_sword_requirement: master_sword
  goron_mines_entrance: closed
  logic_transform_anywhere: true
  logic_increase_wallet_capacity: false
  logic_damage_multiplier: double

  # Keep other players' important items out of the final dungeon, so nobody waits
  # on the very end of this game for them.
  exclude_locations: [Hyrule Castle]

  # Pull this game's progression earlier, so there's less waiting in the long tail.
  progression_balancing: 70

  # Start with the Shadow Crystal, so you can turn into a wolf from the beginning.
  start_inventory_from_pool:
    Shadow Crystal: 1
